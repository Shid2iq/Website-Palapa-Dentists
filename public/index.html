var DEPTX={"Endodontic": {"tag": "Spesialisasi Kedokteran Gigi yang menangani perawatan saraf dan saluran akar gigi secara mendalam", "about": "Merupakan sebuah cabang ilmu kedokteran gigi yang bertujuan untuk mempertahankan gigi selama mungkin di dalam mulut. Layanan dari bidang spesialis ini melingkupi penambalan pada gigi berlubang, restorasi mahkota, onlay, dan inlay, serta perawatan saluran akar gigi yang terlalu dalam hingga mencapai daerah saraf gigi. Perawatan saluran akar gigi/rawat saraf gigi ini dapat dilakukan dalam sekali kunjungan atau beberapa kali kunjungan. Seringkali perawatan yang dilakukan memerlukan perawatan ulang di kemudian hari.\n\nOleh karena itu diperlukan seorang ahli konservasi gigi yang lebih berhati-hati dalam menangani kasus-kasus infeksi gigi. Dokter gigi bergelar Sp.KG ini juga dibekali keterampilan untuk pemutihan gigi dari dalam mahkota (intra corona) dan dari luar mahkota (ekstra corona). Gigi yang sudah mengalami kematian pada sarafnya biasanya mengalami perubahan warna menjadi lebih gelap, kasus ini dapat diatasi dengan pemutihan intra corona.", "notet": "", "note": "", "treat": "Perawatan Saluran Akar (PSA) Gigi\nPenambalan\nCrown\nScaling\nVeneer\nBleaching Intra Corona\nPemasangan Pin\nDesentisisasi Dentin\nInsisi Abses"}, "Orthodontic": {"tag": "Spesialisasi Kedokteran Gigi yang menangani pemasangan kawat gigi untuk meratakan posisi gigi", "about": "Merupakan sebuah cabang ilmu kedokteran gigi yang mempelajari perawatan ketidakharmonisan gigi. Spesialis ini fokus dalam memperbaiki posisi gigi yang tidak teratur agar fungsi kunyah berfungsi dengan benar dan struktur wajah terlihat seimbang.\n\nOleh karena itu diperlukan seseorang yang ahli dalam bidang Ortodonti dalam menangani masalah tersebut. Dokter yang dapat menangani kasus tersebut adalah dokter gigi spesialis Orthodontic, yang bergelar Sp. Ort.\n\nDalam kasus tersebut, spesialis ini mengarahkan pemasangan kabel gigi atau yang sering disebut behel untuk meratakan gigi. Namun sebelum pemasangan, akan dilakukan konsultasi terlebih dahulu terkait kondisi gigi pasien, cara mendapatkan posisi gigi yang ideal, dan lama perawatan yang disesuaikan dengan kondisi gigi pasien hingga mendapatkan posisi gigi yang teratur atau ideal. Rata-rata lama perawatan yang dilakukan membutuhkan waktu bulanan hingga tahunan, tergantung dari parah atau tidaknya susunan gigi yang akan dirapihkan.", "notet": "Di Palapa Dentists", "note": "Palapa Dentists menyediakan beberapa jenis kawat gigi yang dapat dipilih oleh pasien, yaitu kawat gigi konvensional (menggunakan karet), invisalign/aligners (mengikuti bentuk gigi), dan Damon Clear.", "treat": "Pemasangan Kawat Gigi/Brackets\nRetainer\nOrtho Lepasan"}, "Oral Surgery": {"tag": "Spesialisasi Kedokteran Gigi yang khusus menangani pembedahan di area oral (mulut) dan rahang", "about": "Merupakan spesialisasi bedah dalam kedokteran gigi yang dilakukan pada area mulut (oral) dan rahang bawah.\n\nSpesialis ini fokus pada masalah-masalah seperti impaksi gigi (gigi yang tumbuh miring), implan gigi, masalah sendi rahang (pertumbuhan rahang yang tidak merata), patah tulang pada area wajah atau rahang bawah yang menyebabkan gangguan pada fungsi mulut, dan bibir sumbing.\n\nTindakan pembedahan pada area mulut haruslah dilakukan oleh seorang dokter gigi spesialis bedah mulut yang bergelar Sp. BM.", "notet": "Di Palapa Dentists", "note": "Pembedahan yang dilakukan memiliki prosedur tertentu dalam praktiknya. Di Dokter Gigi Palapa, pasien akan diarahkan untuk berkonsultasi terlebih dahulu dengan Dokter Umum (Dokter Gigi Umum). Konsultasi ini bertujuan untuk melihat seberapa parah masalah kondisi mulut (oral) pasien. Jika diperlukan melakukan pembedahan, pasien akan dirujuk ke spesialis Bedah Mulut untuk melanjutkan perawatannya.", "treat": "Odontectomy\nEkstrasi Komplikasi\nPencabutan Gigi\nFlap Operation\nBonegraf\nApexreseksi\nFrenulectomy\nAlveolectomy\nEksisi (Pengangkatan Mucocele)\nImplan Gigi"}, "Prosthodontic": {"tag": "Spesialisasi Kedokteran Gigi yang menangani pemasangan gigi palsu pada area gigi yang tanggal", "about": "Merupakan cabang ilmu kedokteran gigi yang fokus pada perawatan gangguan gigi yang parah, seperti gigi yang lepas, karies gigi, gigi retak atau patah. Tujuan dari spesialis Prostodonsia seringkali dikaitkan dengan kecantikan, karena selain untuk memperbaiki fungsi kunyah dan bicara, juga memperbaiki estetika mulut dalam hal penampilan.\n\nLayanan dari spesialis ini adalah pemasangan gigi palsu (lepas-pasang) pada bagian gigi yang telah tanggal, crown, bridge, inlay, onlay, tambalan gigi, serta protesis gigi. Pemasangan gigi palsu hanya dapat dilakukan oleh dokter gigi spesialis Prosthodontic yang bergelar Sp. Pros.", "notet": "Di Palapa Dentists", "note": "Tipe gigi palsu yang disediakan di Palapa Dentists cukup beragam, yaitu tipe akrilik, tipe falplast (lentur), dan tipe GTSKL (Gigi Tiruan Sementara Kerangka Logam). Penggantian gigi palsu bersifat tahunan, tergantung pada pemakaian gigi palsu sebelumnya.", "treat": "Pemasangan Gigi Palsu (Falplast, Akrilik, Gigi Tiruan Sementara Kerangka Logam)\nImplan Gigi\nCrown\nBridge\nPemasangan Pin"}, "Periodontic": {"tag": "Spesialisasi Kedokteran Gigi yang menangani permasalahan jaringan penyangga gigi", "about": "Merupakan spesialisasi kedokteran gigi yang menangani masalah jaringan penyangga gigi seperti gusi, tulang, dan struktur lain terkait gigi. Periodontik menangani masalah gigi terkait penyakit gusi yang sangat parah, seperti gusi berdarah, bau mulut, gigi yang berpindah, gigi yang goyang karena karang gigi yang terlalu dalam atau berada di bawah gusi. Dokter gigi yang mengambil spesialisasi ini disebut Periodontis atau dokter gigi bergelar Sp. Perio.\n\nLayanan dari spesialis ini berupa pembersihan secara menyeluruh pada jaringan penyangga gigi, seperti gingivektomi (membuang jaringan gusi yang sakit), couterisasi (memotong gusi menggunakan alat), dan ablasi (menghilangkan warna kehitaman pada gusi akibat rokok). Pembersihan ini dilakukan untuk menghindari berkembangnya bakteri dan rusaknya struktur gigi di dalam mulut.", "notet": "Di Palapa Dentists", "note": "Di Palapa Dentists, pasien bisa langsung menemui Spesialis Periodontik atau menunggu referensi dari Spesialis Konservasi Gigi terkait masalah jaringan penyangga gigi yang dialami.", "treat": "Pemasangan Pin\nGingivektomi\nSplinting\nBonegraf\nFlap Operation\nFlap Gingiva\nCrown Lengthening\nAblasi\nScaling\nPenambalan"}, "Pedodontic": {"tag": "Spesialisasi Kedokteran Gigi yang khusus menangani segala permasalahan gigi pada anak-anak", "about": "Merupakan cabang ilmu kedokteran gigi yang khusus melakukan perawatan gigi pada pasien anak-anak di bawah umur 15 tahun. Di Palapa Dokter Gigi, rata-rata usia pasien anak-anak yang melakukan perawatan berada pada usia dua sampai dua belas tahun. Dokter gigi yang khusus menangani pasien anak-anak biasa disebut sebagai Dokter Spesialis Kedokteran Gigi Anak bergelar Sp. KGA.\n\nDokter gigi anak memegang peranan penting dalam menangani pertumbuhan gigi pada anak, seperti memadukan pertumbuhan gigi susu pada anak agar pertumbuhan gigi permanen berjalan lancar serta mengajarkan cara menjaga kesehatan mulut yang benar.\n\nDokter gigi anak fokus pada perawatan gigi berlubang, gigi susu yang tanggal, dan gigi susu yang memerlukan perawatan saluran akar. Pada kasus gigi berlubang, perawatan hanya dilakukan dalam satu kali kunjungan, sedangkan kasus gigi yang memerlukan perawatan saluran akar membutuhkan perawatan secara berkala.", "notet": "", "note": "", "treat": "Perawatan Saluran Akar (PSA) Gigi Susu\nCabut Gigi Susu\nMetal Crown\nCelluloid Crown\nSpace Maintainer\nScaling\nPenambalan\nOrtho Lepasan"}, "_umum": {"tag": "Spesialisasi Kedokteran Gigi yang menangani pemeriksaan gigi secara general pada anak-anak dan dewasa", "about": "General Practicioner Dentists atau yang sering disebut Dokter Gigi Umum merupakan seseorang yang telah menyelesaikan pendidikan dokter gigi selama kurang lebih lima tahun. Dokter Gigi Umum akan memberikan diagnosa, pemeriksaan, dan pengobatan gigi, mulut, dan rahang bawah secara umum.", "notet": "Di Palapa Dentists", "note": "Di Palapa Dentists, pada umumnya, pasien akan diarahkan ke dokter gigi umum terlebih dahulu, jika dokter gigi umum menemukan masalah gigi yang memerlukan tindakan lebih lanjut, maka pasien akan dirujuk ke spesialis yang tersedia.", "treat": "Konsultasi\nScaling\nPenambalan\nBleaching"}};

function tkKey(d){var s=(String(d.name||'')+' '+String(d.latin||'')).toLowerCase();if(/radiolog/.test(s))return 'radiologi';if(/konservasi|endodont/.test(s))return 'konservasi';if(/meratakan|ortho/.test(s))return 'ortho';if(/bedah|surgery/.test(s))return 'bedah';if(/palsu|prosth|prosto/.test(s))return 'prosto';if(/penyangga|period/.test(s))return 'perio';if(/anak|pedo/.test(s))return 'anak';if(/umum|general/.test(s))return 'umum';return ''}
function tkBox(){return '<div class="box" style="padding:18px 20px;margin-bottom:14px;max-width:760px"><h3>Daftar tindakan dari Price List 2025</h3><p class="note" style="margin:6px 0 12px">Mengisi kolom <b>Tindakan yang tersedia</b> semua layanan sekaligus dengan daftar lengkap dari Price List 2025 (tanpa harga). 10 tindakan pertama tampil di halaman Departments, selebihnya di menu Tindakan. <b>Isi lama kolom itu akan diganti.</b> Bisa juga disalin manual dari file daftar tindakan.</p><button type="button" class="btn sm" data-a="tkimport">Isi dari Price List 2025</button></div>'}
async function tkImport(){var L=srt('departments'),n=0,sk=[];if(!confirm('Isi kolom "Tindakan yang tersedia" semua layanan dengan daftar lengkap dari Price List 2025?\n\nIsi lama kolom itu akan diganti.'))return;try{for(var i=0;i<L.length;i++){var d=L[i],k=tkKey(d);if(!k||!TKL[k]){sk.push(String(d.name).split(' / ')[0]);continue}var f=(typeof deptFx=='function'&&deptFx(d))||{},o={treat:TKL[k].join('\n')};['tag','about','notet','note'].forEach(function(q){if(d[q]===undefined&&f[q]!==undefined)o[q]=f[q]});await db.doc('departments/'+d.id).update(o);n++}toast(n+' layanan diperbarui'+(sk.length?'. Dilewati (tidak dikenali): '+sk.join(', '):''))}catch(er){toast('Gagal menyimpan. Pastikan data layanan sudah tersimpan di database (bukan data contoh).')}}

 var groups=show.map(function(d){var v=deptView(d).treat,nm=String(d.name).split(' / ');if(!v.length)return '';tot+=v.length;return '<section class="tkg"><h3>'+esc(nm[0])+(nm[1]?' <small>'+esc(nm.slice(1).join(' / '))+'</small>':'')+' <span class="tkc">'+v.length+' tindakan</span></h3><ul class="tkl">'+v.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><div class="tkf"><a class="btn line sm" href="#/departments/'+esc(d.id)+'">Tentang layanan ini</a></div></section>'}).join('');
 return '<div class="dsn">'+ph2('Tindakan','Daftar lengkap tindakan di setiap layanan Palapa Dentists','Tindakan')+'<section class="s2" style="padding-top:34px"><div class="wrap"><input id="tksq" class="tks" type="search" placeholder="Cari tindakan (mis. scaling, kawat gigi, cabut gigi)" aria-label="Cari tindakan" autocomplete="off">'+chips+'<p class="mut" id="tkn" style="margin:0 0 14px">'+tot+' tindakan'+(sel?'':' di '+show.length+' layanan')+'</p>'+(groups||'<p class="mut">Daftar tindakan belum tersedia.</p>')+'<p class="tkx" id="tkempty" hidden>Tidak ada tindakan yang cocok dengan pencarian Anda.</p><div class="tknote"><p><b>Perlu diketahui:</b> daftar ini bersifat informasi. Tindakan yang sesuai ditentukan dokter setelah pemeriksaan, dan biaya pastinya mengikuti kondisi masing-masing sahabat. Perkiraan biaya ada di halaman <a href="#/katalog">Katalog</a>, atau tanyakan kepada bagian pendaftaran.</p><a class="btn lime" href="#/contact">Buat janji temu</a></div></div></section></div>'}
document.addEventListener('input',function(e){if(!e.target||e.target.id!='tksq')return;var q=e.target.value.trim().toLowerCase(),shown=0;document.querySelectorAll('.tkg').forEach(function(g){var any=false;g.querySelectorAll('li').forEach(function(li){var ok=!q||li.textContent.toLowerCase().indexOf(q)>=0;li.hidden=!ok;if(ok){any=true;shown++}});g.hidden=!any});var em=document.getElementById('tkempty');if(em)em.hidden=shown>0||!q;var nn=document.getElementById('tkn');if(nn&&q)nn.textContent=shown+' tindakan cocok'});
var DX2={"umum":{"about2":"Layanan ini cocok sebagai pintu masuk pertama Anda ke Palapa Dentists. Dokter akan memeriksa kondisi gigi, gusi, dan rongga mulut secara menyeluruh, mendengarkan keluhan Anda, lalu menjelaskan temuan serta pilihan perawatan dengan bahasa yang mudah dipahami.\n\nPemeriksaan rutin secara berkala membantu masalah gigi terdeteksi lebih awal, saat penanganannya umumnya masih sederhana. Bila kondisi Anda memerlukan penanganan khusus, dokter akan menyarankan dan mengarahkan Anda ke layanan spesialis yang sesuai.","when":"Pemeriksaan gigi rutin secara berkala, misalnya enam bulan sekali\nGigi berlubang, ngilu, atau terasa sakit\nKarang gigi menumpuk atau napas terasa kurang segar\nGusi mudah berdarah atau bengkak\nGigi tampak kuning dan ingin diputihkan\nBelum tahu harus ke spesialis mana, mulai saja dari konsultasi"},"konservasi":{"about2":"Pada kunjungan awal, dokter akan memeriksa gigi yang dikeluhkan dan, bila diperlukan, menyarankan pemeriksaan penunjang seperti rontgen untuk melihat kondisi akar dan jaringan di sekitarnya. Dari hasil tersebut dokter menjelaskan pilihan perawatan, mulai dari tambalan hingga perawatan saluran akar, sebelum tindakan dimulai.\n\nGigi yang sudah dirawat saluran akarnya umumnya perlu dilindungi dengan restorasi akhir, seperti tambalan permanen atau mahkota (crown), agar kuat digunakan mengunyah. Dokter akan membahas rencana perawatan lanjutan tersebut bersama Anda, termasuk kerja sama dengan layanan Pembuatan Gigi Palsu bila crown diperlukan.","when":"Gigi berlubang, atau tambalan lepas dan patah\nGigi ngilu saat terkena minuman dingin, panas, atau manis\nSakit gigi berdenyut, terutama pada malam hari\nGigi berubah warna atau tampak menggelap\nGusi bengkak atau muncul benjolan di sekitar gigi\nGigi retak atau patah akibat benturan"},"ortho":{"about2":"Perawatan ortodonti diawali dengan pemeriksaan dan pengumpulan data, seperti foto, cetakan atau pemindaian gigi, serta rontgen bila diperlukan, sebagai dasar rencana perawatan. Dokter kemudian menjelaskan pilihan perangkat, perkiraan lama perawatan, dan hal yang perlu Anda lakukan di rumah.\n\nPerawatan berlangsung bertahap dan memerlukan kontrol berkala. Setelah gigi berada pada posisi yang diinginkan, Anda akan memakai retainer untuk menjaga hasilnya. Kebersihan gigi dan gusi tetap perlu dijaga dengan baik selama perawatan.","when":"Gigi berjejal, tumpang tindih, atau tidak rata\nGigi renggang atau berjarak\nGigi depan terlalu maju atau gigitan terasa tidak pas\nSulit membersihkan gigi karena letaknya berhimpitan\nIngin merapikan susunan gigi untuk senyum yang lebih percaya diri\nAnak yang pertumbuhan gigi dan rahangnya perlu dipantau sejak dini"},"bedah":{"about2":"Sebelum tindakan, dokter akan memeriksa kondisi Anda, melihat hasil rontgen bila diperlukan, serta menanyakan riwayat kesehatan dan obat yang sedang dikonsumsi. Rencana tindakan, anestesi yang digunakan, dan risiko yang mungkin terjadi akan dijelaskan terlebih dahulu agar Anda dapat bertanya dan menyetujuinya.\n\nSetelah tindakan, Anda akan mendapat petunjuk perawatan di rumah dan jadwal kontrol bila diperlukan. Mengikuti anjuran dokter membantu proses pemulihan berjalan lebih baik.","when":"Gigi yang sudah tidak dapat dipertahankan dan perlu dicabut\nGigi bungsu yang tumbuh miring, tertutup gusi, atau sering terasa sakit dan bengkak\nSisa akar gigi yang masih tertinggal\nBenjolan, kista, atau luka di rongga mulut yang tidak kunjung sembuh\nIngin mengganti gigi yang hilang dengan implan gigi\nSelaput tali lidah atau bibir yang mengganggu"},"prosto":{"about2":"Dokter akan menilai kondisi gigi yang tersisa, gusi, dan tulang pendukung, lalu menjelaskan pilihan penggantian gigi yang sesuai, misalnya gigi tiruan lepasan, crown dan bridge, veneer, atau implan gigi, lengkap dengan kelebihan dan hal yang perlu diperhatikan dari tiap pilihan. Pembuatannya umumnya melalui beberapa tahap, mulai dari pencetakan, uji coba, hingga pemasangan.\n\nGigi tiruan dan restorasi perlu dirawat serta dikontrol secara berkala agar tetap nyaman dan berfungsi baik. Dokter akan memberikan panduan perawatan serta jadwal kontrol setelah pemasangan.","when":"Gigi hilang dan ingin mengembalikan fungsi mengunyah serta penampilan\nGigi rusak cukup besar sehingga memerlukan mahkota (crown)\nGigi depan berubah warna atau bentuk dan ingin disempurnakan dengan veneer\nGigi tiruan lama terasa longgar, patah, atau tidak nyaman\nSering menggertakkan gigi saat tidur atau rahang terasa nyeri"},"perio":{"about2":"Pemeriksaan jaringan periodontal biasanya mencakup pengecekan kondisi gusi, kedalaman celah antara gusi dan gigi, serta rontgen bila diperlukan untuk melihat tulang penyangga. Dari hasil tersebut dokter menyusun rencana perawatan, mulai dari pembersihan karang gigi hingga tindakan lanjutan bila diperlukan.\n\nMasalah gusi umumnya berkembang perlahan dan sering tidak terasa sakit pada tahap awal. Perawatan yang dilakukan secara berkala, ditambah kebiasaan menyikat gigi dan membersihkan sela gigi dengan benar di rumah, membantu menjaga gusi dan tulang penyangga tetap sehat.","when":"Gusi mudah berdarah saat menyikat gigi\nGusi tampak merah, bengkak, atau terasa nyeri\nNapas tidak segar yang tidak kunjung membaik\nKarang gigi menumpuk\nGigi terasa goyang atau gusi tampak turun\nIngin merapikan bentuk gusi"},"anak":{"about2":"Kunjungan anak dimulai dengan pendekatan yang tenang dan bertahap agar si kecil merasa nyaman. Dokter menjelaskan tindakan dengan bahasa yang mudah dipahami anak, serta memberi edukasi kesehatan gigi (DHE) kepada orang tua tentang cara menyikat gigi, pola makan, dan pencegahan gigi berlubang.\n\nPemeriksaan sejak dini membantu memantau pertumbuhan gigi susu dan gigi permanen. Pencegahan seperti topikal fluor dan sealant pada gigi geraham dapat dibahas dengan dokter sesuai kebutuhan anak. Orang tua dianjurkan mendampingi anak selama kunjungan.","when":"Gigi susu berlubang atau tampak menghitam\nAnak mengeluh sakit gigi atau sulit makan\nGigi susu goyang tetapi gigi permanen sudah tumbuh di belakangnya\nSusunan gigi anak tumbuh tidak teratur atau ada kebiasaan mengisap jari\nGigi anak patah atau terbentur\nPemeriksaan rutin dan pencegahan, seperti topikal fluor dan sealant"},"radiologi":{"about2":"Pemeriksaan radiologi dilakukan sesuai kebutuhan klinis yang ditentukan dokter. Tiap jenis pemeriksaan punya fungsi berbeda: rontgen dental memperlihatkan gigi dan akar secara terfokus, panoramic menampilkan seluruh gigi dan rahang dalam satu gambar, cephalometric membantu perencanaan perawatan ortodonti, TMJ melihat sendi rahang, dan CBCT memberikan gambaran tiga dimensi.\n\nPemeriksaan berlangsung singkat dan tidak menimbulkan rasa sakit. Hasilnya akan dijelaskan oleh dokter, dan Anda dapat membawa hasil rontgen sebelumnya untuk dibandingkan. Informasikan kepada dokter atau petugas bila Anda sedang hamil atau memiliki kondisi kesehatan tertentu.","when":"Dokter menyarankan rontgen sebelum atau sesudah perawatan\nSakit gigi yang penyebabnya belum jelas dari pemeriksaan biasa\nGigi bungsu atau gigi yang belum tumbuh\nPerencanaan kawat gigi, implan gigi, atau tindakan bedah\nEvaluasi sendi rahang (TMJ) atau tulang rahang secara tiga dimensi (CBCT)\nPerlu pembaruan hasil rontgen"}};
