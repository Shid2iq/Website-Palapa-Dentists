# Salin ke /etc/nginx/sites-available/palapa  lalu:
#   sudo ln -s /etc/nginx/sites-available/palapa /etc/nginx/sites-enabled/palapa
#   sudo nginx -t && sudo systemctl reload nginx
# Ganti palapadentists.com dengan domain Anda.
server {
    listen 80;
    server_name palapadentists.com www.palapadentists.com;
    client_max_body_size 6m;          # upload foto maksimal 5 MB

    location /api/chats/stream {      # pemberitahuan chat langsung (SSE): jangan di-buffer
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
